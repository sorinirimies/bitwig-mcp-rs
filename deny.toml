[advisories]
yanked = "deny"
ignore = [
    # chrono is pulled in by rmcp's and schemars' chrono04 feature (JSON schema support for tool params).
    # No fixed release exists; revisit when rmcp/schemars drop chrono or a patched chrono is published.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, transitive via rmcp/schemars; no safe upgrade available" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
