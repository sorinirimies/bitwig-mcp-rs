[workspace]
resolver = "3"
members = ["crates/*"]

# One version for every crate; `just bump X.Y.Z` edits it (and EXTRA_MANIFESTS).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/sorinirimies/bitwig-mcp-rs"
homepage = "https://github.com/sorinirimies/bitwig-mcp-rs"

[workspace.dependencies]
# Shared dependency versions live here; crates use `dep = { workspace = true }`.
anyhow = "1"
rmcp = { version = "3.9", features = ["server", "macros", "schemars", "transport-io"] }
rosc = "0.11"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hardware synth profiles, shared with the Synthazia DAW (~/Projects/synthazia).
synthazia-hardware = "0.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# `pub` only for what another crate uses; then dead_code finds the rest.
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
