# Behringer EDGE — the manual has no MIDI CC table; MIDI is notes plus clock for the
# sequencer.
name = "Edge"
channel = 5
notes = """Analog percussion synth with an 8-step sequencer. No MIDI CCs: the sound is the
knobs and the patch bay. MIDI: notes and clock (set CLOCK to MIDI or USB and enable MIDI clock
out for this port in Bitwig; tempo over MIDI is 10-300 BPM). Use transport play/stop in Bitwig
to run its sequencer in sync."""

[params.pitch_bend]
pitch_bend = true
description = "0.5 = center; unverified"
