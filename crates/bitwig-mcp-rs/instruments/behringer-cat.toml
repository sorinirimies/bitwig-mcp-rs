# Behringer CAT — from the official Quick Start Guide MIDI chart: note on/off, pitch bend,
# all notes off. Nothing else is MIDI-controllable.
name = "CAT"
channel = 3
notes = """Duophonic analog synth (Octave Cat clone). MIDI: notes and pitch bend only; every
sound parameter is a front-panel knob. Set the MIDI channel with the rear DIP switches to match
`channel`. Two notes at once play duophonically."""

[params.pitch_bend]
pitch_bend = true
description = "0.5 = center"
[params.all_notes_off]
cc = 123
description = "send any value: stops hanging notes"
