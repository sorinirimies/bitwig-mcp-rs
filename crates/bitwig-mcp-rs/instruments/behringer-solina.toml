# Behringer SOLINA STRING ENSEMBLE — the manual has no MIDI CC table: 49-voice notes on
# MIDI, everything else on the panel.
name = "Solina"
channel = 6
notes = """Analog string ensemble (ARP Solina clone), 49 voices. MIDI: notes only; tone
sections, chorus and phaser are panel controls. Long held chords suit it best: write clips
with long note lengths."""

[params.all_notes_off]
cc = 123
description = "send any value: stops hanging notes; unverified"
