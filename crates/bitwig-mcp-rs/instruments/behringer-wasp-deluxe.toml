# Behringer WASP DELUXE — same SysEx settings table as the MODEL D (channel, key priority,
# pitch-bend range, modulation curve). Mod wheel and all-notes-off are unverified.
name = "Wasp"
channel = 4
notes = """Hybrid analog mono synth (EDP Wasp clone). MIDI: notes, pitch bend, mod wheel. Sound
parameters are knobs. Settings need SysEx (SynthTool). Set the channel with the rear DIP
switches."""

[params.mod_wheel]
cc = 1
description = "modulation (mod wheel); unverified, test it"
[params.pitch_bend]
pitch_bend = true
description = "0.5 = center"
[params.all_notes_off]
cc = 123
description = "send any value: stops hanging notes; unverified"
