[package]
name = "bitwig-mcp-rs"
description = "MCP server that lets AI assistants compose and produce in Bitwig Studio: tracks, clips, devices, mixing, music theory and hardware synths"
readme = "../../README.md"
keywords = ["bitwig", "mcp", "midi", "daw", "music"]
categories = ["command-line-utilities", "multimedia::audio"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "bitwig_mcp_rs"
path = "src/lib.rs"

[[bin]]
name = "bitwig-mcp-rs"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
dirs = { workspace = true }
rmcp = { workspace = true }
rosc = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
synthazia-hardware = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

